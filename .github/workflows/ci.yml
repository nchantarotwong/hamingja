name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests and installed distribution
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"

      - name: Run tests
        run: |
          python -m pip install --disable-pip-version-check '.[test]' build twine
          python -m pytest -q

      - name: Build and validate distributions
        run: |
          python -m build
          python -m twine check dist/*

      - name: Smoke test installed wheel in isolation
        run: |
          smoke_env=$(mktemp -d)
          python -m venv "$smoke_env"
          "$smoke_env/bin/python" -m pip install --no-deps dist/*.whl
          "$smoke_env/bin/python" -I scripts/check_distribution.py
