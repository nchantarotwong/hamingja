[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-rails"
dynamic = ["version"]
description = "Fail-open partner rails for Codex and Claude Code."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Nels Chantarotwong" }]
keywords = ["llm", "agent", "guardrails", "claude-code", "codex", "safety"]

[project.scripts]
agent-rails = "agent_rails.cli:main"

[project.optional-dependencies]
test = ["pytest>=9"]

[project.urls]
Homepage = "https://github.com/nchantarotwong/agent-rails"
Repository = "https://github.com/nchantarotwong/agent-rails.git"
Issues = "https://github.com/nchantarotwong/agent-rails/issues"

[tool.setuptools.packages.find]
include = ["agent_rails*"]

[tool.setuptools.dynamic]
version = {attr = "agent_rails.__version__"}

[tool.setuptools.package-data]
agent_rails = ["config.default.json"]
"agent_rails.adapters.claude_code" = ["install.sh"]
"agent_rails.adapters.codex" = ["install.sh"]
"agent_rails.profiles" = ["*.md"]
"agent_rails.templates" = ["*.md"]
"agent_rails.templates.codex" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
