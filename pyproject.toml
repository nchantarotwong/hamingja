[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hamingja"
dynamic = ["version"]
description = "Fail-open partner rails for Codex and Claude Code."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Nels Chantarotwong" }]
keywords = ["llm", "agent", "guardrails", "claude-code", "codex", "safety"]

[project.scripts]
hamingja = "hamingja.cli:main"

[project.optional-dependencies]
test = ["pytest>=9"]

[project.urls]
Homepage = "https://github.com/nchantarotwong/hamingja"
Repository = "https://github.com/nchantarotwong/hamingja.git"
Issues = "https://github.com/nchantarotwong/hamingja/issues"

[tool.setuptools.packages.find]
include = ["hamingja*"]

[tool.setuptools.dynamic]
version = {attr = "hamingja.__version__"}

[tool.setuptools.package-data]
hamingja = ["config.default.json"]
"hamingja.adapters.claude_code" = ["install.sh"]
"hamingja.adapters.codex" = ["install.sh"]
"hamingja.profiles" = ["*.md"]
"hamingja.templates" = ["*.md"]
"hamingja.templates.codex" = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
